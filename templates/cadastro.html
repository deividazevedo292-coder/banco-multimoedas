<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Banco Multimoedas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; margin: 0; }
        header { background: #0f3d3e; color: white; text-align: center; padding: 20px; }
        header h1 { margin: 0; }
        .card { background: white; border-radius: 12px; padding: 24px; max-width: 360px;
                margin: 40px auto; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .card h2 { margin-top: 0; }
        form { display: grid; gap: 12px; }
        input, button { padding: 10px; font-size: 15px; border-radius: 8px; border: 1px solid #cbd5e1; }
        button { background: #15803d; color: white; border: none; cursor: pointer; }
        .aviso { color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>Banco Multimoedas</h1></header>

    <section class="card">
        <h2>Criar conta</h2>
        {% for msg in get_flashed_messages() %}<p class="aviso">{{ msg }}</p>{% endfor %}
        <form method="post">
            <input name="usuario" placeholder="Usuário" maxlength="50" required>
            <input name="senha" type="password" placeholder="Senha (mín. 6 caracteres)" minlength="6" required>
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem conta? <a href="/login">Entrar</a></p>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimoedas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='26' cy='14' r='12' fill='%238c8c8c' stroke='%23b3b3b3' stroke-width='1.5'/%3E%3Ccircle cx='17' cy='23' r='14' fill='%23f5f5f5' stroke='%23000' stroke-width='2'/%3E%3Cpath d='M11 29V18l6 6 6-6v11' fill='none' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --preto: #000000;
            --superficie: #1c1c1c;
            --superficie-2: #2a2a2a;
            --linha: #3a3a3a;
            --texto: #f5f5f5;
            --suave: #9a9a9a;
            --positivo: #ffffff;
            --negativo: #ff6b5e;
            --petroleo: #8c8c8c;   /* grafite */
            --ouro: #a8a8a8;       /* cinza prata da marca */
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Sora", system-ui, sans-serif;
            background: var(--preto);
            color: var(--texto);
            line-height: 1.5;
        }
        .app { max-width: 600px; margin: 0 auto; padding: 0 20px 48px; }
        h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
        button { font: inherit; color: inherit; cursor: pointer; }
        button:focus-visible, a:focus-visible, input:focus, select:focus {
            outline: 2px solid #f5f5f5; outline-offset: 2px;
        }

        /* ===== TOPO ===== */
        .topo { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
        .ola { display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .logo { flex: none; display: block; }
        .ola strong { display: block; font-weight: 700; font-size: 15px; }
        .ola small { display: block; color: var(--suave); font-size: 12px; }
        .acoes-topo { display: flex; align-items: center; gap: 8px; }
        .icone-botao {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--superficie); display: grid; place-items: center;
        }
        .icone-botao:hover { background: var(--superficie-2); }
        .sair {
            color: var(--texto); text-decoration: none; font-size: 13px;
            padding: 9px 16px; border-radius: 999px; background: var(--superficie);
        }
        .sair:hover { background: var(--superficie-2); }

        /* ===== TOTAL ===== */
        .total {
            margin: 4px 0 28px; padding: 22px 22px 20px; border-radius: 20px;
            background: linear-gradient(135deg, #6b6b6b 0%, #3f3f3f 60%, #2e2e2e 100%);
        }
        .total small { color: rgba(255, 255, 255, 0.8) !important; }
        .total .cotacao { color: #ffffff; border-color: rgba(255, 255, 255, 0.35); background: rgba(0, 0, 0, 0.15); }
        .total small { color: var(--suave); font-size: 13px; }
        .total .numero {
            display: inline-block; font-size: clamp(34px, 9vw, 46px); font-weight: 300;
            letter-spacing: -0.02em; margin: 2px 0 14px; font-variant-numeric: tabular-nums;
        }
        .cotacoes { display: flex; flex-wrap: wrap; gap: 8px; }
        .cotacao { font-size: 12px; color: var(--suave); padding: 5px 12px; border: 1px solid var(--linha); border-radius: 999px; }

        /* ===== ATALHOS ===== */
        .atalhos { display: flex; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid var(--linha); }
        .atalho { background: none; border: none; display: grid; justify-items: center; gap: 8px; font-size: 13px; color: var(--suave); padding: 0; }
        .atalho .circulo {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--superficie); display: grid; place-items: center; color: var(--texto);
            transition: background 0.15s;
        }
        .atalho:hover .circulo { background: var(--superficie-2); }
        .atalho.ativo .circulo { background: var(--ouro); color: var(--preto); }
        .atalho.ativo { color: var(--texto); }

        section.bloco { padding-top: 28px; }

        /* ===== MOVIMENTAR ===== */
        .cartao { background: var(--superficie); border-radius: 20px; padding: 20px; }
        .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { display: block; font-size: 12px; color: var(--suave); margin-bottom: 6px; }
        select, input {
            width: 100%; padding: 13px 14px; font: inherit; font-size: 15px;
            color: var(--texto); background: var(--superficie-2);
            border: 1px solid var(--linha); border-radius: 12px;
        }
        select { appearance: none; }
        .campo-valor { position: relative; }
        .prefixo { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--suave); pointer-events: none; }
        .campo-valor input { padding-left: 50px; }
        .previa { font-size: 13px; color: var(--suave); min-height: 20px; margin: 12px 0 0; }
        .confirmar {
            width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 999px;
            background: var(--ouro); color: var(--preto); font-weight: 600; font-size: 15px;
        }
        .confirmar:hover { background: #c4c4c4; }
        .confirmar:disabled { opacity: 0.5; cursor: wait; }
        #mensagem { margin: 12px 0 0; font-size: 14px; min-height: 21px; text-align: center; }
        .ok { color: #ffffff; }
        .erro { color: #ff8a80; }

        /* ===== MOEDAS ===== */
        .lista { background: var(--superficie); border-radius: 20px; padding: 4px 20px; }
        .linha-lista { display: flex; align-items: center; gap: 14px; padding: 16px 0; }
        .linha-lista + .linha-lista { border-top: 1px solid var(--linha); }
        .moeda-icone {
            flex: none; width: 44px; height: 44px; border-radius: 50%;
            display: grid; place-items: center; font-size: 13px; font-weight: 700;
            background: var(--superficie-2); color: var(--texto);
        }
        .descricao { flex: 1; min-width: 0; }
        .descricao strong { display: block; font-weight: 400; font-size: 15px; }
        .descricao small { color: var(--suave); font-size: 12px; }
        .valor { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .valor strong { display: block; font-weight: 600; font-size: 15px; }
        .valor small { color: var(--suave); font-size: 12px; }
        .positivo { color: var(--positivo); }
        .valor strong:not(.positivo) { color: var(--suave); }

        /* ===== SALDOS EM FORMA DE CÉDULA (marca do Multimoedas) ===== */
        .notas {
            display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr);
            gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory;
        }
        .nota {
            position: relative; overflow: hidden; scroll-snap-align: start;
            border-radius: 18px; padding: 18px; min-height: 140px;
            background: var(--cor, var(--superficie)); border: 1px solid rgba(255, 255, 255, 0.06);
        }
        /* os anéis no fundo imitam o desenho de segurança das cédulas */
        .nota::before {
            content: ""; position: absolute; inset: 0;
            background: repeating-radial-gradient(circle at 110% -10%, transparent 0 9px, rgba(255, 255, 255, 0.05) 9px 10px);
        }
        .nota-simbolo {
            position: absolute; right: 10px; bottom: -24px; line-height: 1;
            font-size: 100px; font-weight: 700; color: rgba(255, 255, 255, 0.08);
        }
        .nota-nome { position: relative; font-size: 13px; color: var(--destaque, var(--suave)); }
        .nota strong {
            position: relative; display: inline-block; margin-top: 22px;
            font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums;
        }
        .nota-codigo { position: relative; display: block; font-size: 11px; color: var(--suave); letter-spacing: 0.08em; margin-top: 2px; }
        .nota.usd { --cor: #4d4d4d; --destaque: #f0f0f0; }
        .nota.eur { --cor: #3d3d3d; --destaque: #e0e0e0; }
        .nota.gbp { --cor: #2f2f2f; --destaque: #d0d0d0; }
        .vazio { color: var(--suave); text-align: center; padding: 24px 0; font-size: 14px; }

        /* ===== OLHINHO: esconde os valores ===== */
        body.oculto .sensivel {
            color: transparent !important; background: var(--superficie-2);
            border-radius: 6px; user-select: none;
        }

        @media (max-width: 480px) {
            .campos { grid-template-columns: 1fr; }
            .ola span { display: none; }
        }
    </style>
</head>
<body>
<div class="app">

    <header class="topo">
        <div class="ola">
            <svg class="logo" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="26" cy="14" r="12" fill="#8c8c8c" stroke="#b3b3b3" stroke-width="1.5"/><circle cx="26" cy="14" r="8" fill="none" stroke="#b3b3b3" stroke-width="1"/><circle cx="17" cy="23" r="14" fill="#f5f5f5" stroke="#000" stroke-width="2"/><path d="M11 29V18l6 6 6-6v11" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div>
                <strong>Multimoedas</strong>
                <small>Olá, {{ session['nome'] }}</small>
            </div>
        </div>
        <div class="acoes-topo">
            <button class="icone-botao" id="olho" onclick="alternarValores()" aria-label="Esconder valores">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
            <a class="sair" href="/logout">Sair</a>
        </div>
    </header>

    <!-- TOTAL E COTAÇÕES -->
    <section class="total">
        <small>Total depositado</small><br>
        <span class="numero sensivel" id="total">R$ 0,00</span>
        <div class="cotacoes" id="cotacoes"></div>
    </section>

    <!-- ATALHOS -->
    <nav class="atalhos" aria-label="Ações">
        <button class="atalho ativo" id="atalho-depositar" aria-pressed="true" onclick="escolherModo('depositar')">
            <span class="circulo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            </span>
            Depositar
        </button>
        <button class="atalho" id="atalho-sacar" aria-pressed="false" onclick="escolherModo('sacar')">
            <span class="circulo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </span>
            Sacar
        </button>
    </nav>

    <!-- DEPOSITAR E SACAR -->
    <section class="bloco">
        <h2 id="titulo-mov">Depositar</h2>
        <div class="cartao">
            <div class="campos">
                <div>
                    <label for="moeda">Moeda</label>
                    <select id="moeda" onchange="atualizarTela()"></select>
                </div>
                <div>
                    <label for="valor" id="rotulo-valor">Valor em reais</label>
                    <div class="campo-valor">
                        <span class="prefixo" id="prefixo">R$</span>
                        <input type="number" id="valor" placeholder="0,00" step="0.01" min="0.01" oninput="atualizarTela()">
                    </div>
                </div>
            </div>
            <p class="previa" id="previa"></p>
            <button class="confirmar" id="confirmar" onclick="enviar(modo)">Depositar</button>
            <p id="mensagem" role="status"></p>
        </div>
    </section>

    <!-- SALDOS -->
    <section class="bloco">
        <h2>Suas moedas</h2>
        <div class="notas" id="saldos"></div>
    </section>

    <!-- EXTRATO -->
    <section class="bloco">
        <h2>Extrato</h2>
        <div class="lista" id="extrato"></div>
    </section>

</div>

<script>
    // O usuário vem do login: o servidor sabe quem está logado pela sessão.

    let modo = "depositar";   // "depositar" ou "sacar"
    let moedas = [];          // guardamos as moedas para a prévia e o extrato

    // Mostra números no formato brasileiro: 1234.5 vira "1.234,50"
    function formatar(numero) {
        return numero.toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
        });
    }

    // fetch que manda de volta para o login se a sessão tiver expirado
    async function buscar(url, opcoes) {
        const resposta = await fetch(url, opcoes);
        if (resposta.redirected) {
            window.location.href = "/login";
            throw new Error("Sessão expirada");
        }
        return resposta;
    }

    function simboloDe(codigo) {
        const moeda = moedas.find(m => m.codigo === codigo);
        return moeda ? moeda.simbolo : codigo;
    }

    // Busca as moedas, preenche o <select> e mostra as cotações
    async function carregarMoedas() {
        const resposta = await buscar("/moedas");
        moedas = await resposta.json();

        const select = document.getElementById("moeda");
        let cotacoes = "";
        for (const moeda of moedas) {
            const opcao = document.createElement("option");
            opcao.value = moeda.codigo;
            opcao.textContent = moeda.nome + " (" + moeda.simbolo + ")";
            select.appendChild(opcao);

            cotacoes += '<span class="cotacao">1 ' + moeda.codigo + " = R$ " + formatar(moeda.cotacao) + "</span>";
        }
        document.getElementById("cotacoes").innerHTML = cotacoes;
        atualizarTela();
    }

    // Busca os saldos e mostra cada moeda em uma linha
    async function carregarSaldos() {
        const resposta = await buscar("/saldos");
        const dados = await resposta.json();

        document.getElementById("total").textContent = "R$ " + formatar(dados.total_depositado_reais);

        let html = "";
        for (const saldo of dados.saldos) {
            html += '<article class="nota ' + saldo.codigo.toLowerCase() + '">' +
                    '<span class="nota-simbolo" aria-hidden="true">' + saldo.simbolo + "</span>" +
                    '<span class="nota-nome">' + saldo.nome + "</span><br>" +
                    '<strong class="sensivel">' + saldo.simbolo + " " + formatar(saldo.valor) + "</strong>" +
                    '<span class="nota-codigo">' + saldo.codigo + "</span>" +
                    "</article>";
        }
        if (html === "") {
            html = '<p class="vazio">Você ainda não tem saldo em nenhuma moeda.</p>';
        }
        document.getElementById("saldos").innerHTML = html;
    }

    // Busca o extrato e monta a lista de movimentações
    async function carregarExtrato() {
        const resposta = await buscar("/extrato");
        const movimentos = await resposta.json();

        let html = "";
        // reverse() mostra o mais recente primeiro
        for (const mov of movimentos.reverse()) {
            const deposito = mov.tipo === "deposito";
            const simbolo = simboloDe(mov.moeda);
            const seta = deposito
                ? '<path d="M12 5v14M5 12l7 7 7-7"/>'
                : '<path d="M12 19V5M5 12l7-7 7 7"/>';
            const reais = mov.valor_reais === null ? "" : "<small>R$ " + formatar(mov.valor_reais) + "</small>";

            html += '<div class="linha-lista">' +
                    '<span class="moeda-icone"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + seta + "</svg></span>" +
                    '<div class="descricao"><strong>' + (deposito ? "Depósito" : "Saque") + " em " + mov.moeda + "</strong><small>" + mov.data + "</small></div>" +
                    '<div class="valor"><strong class="sensivel' + (deposito ? " positivo" : "") + '">' +
                    (deposito ? "+ " : "- ") + simbolo + " " + formatar(mov.valor_moeda) + "</strong>" + reais + "</div>" +
                    "</div>";
        }
        if (html === "") {
            html = '<p class="vazio">Nenhuma movimentação ainda. Faça seu primeiro depósito.</p>';
        }
        document.getElementById("extrato").innerHTML = html;
    }

    // Troca entre Depositar e Sacar
    function escolherModo(novoModo) {
        modo = novoModo;
        const depositando = modo === "depositar";

        document.getElementById("atalho-depositar").classList.toggle("ativo", depositando);
        document.getElementById("atalho-sacar").classList.toggle("ativo", !depositando);
        document.getElementById("atalho-depositar").setAttribute("aria-pressed", depositando);
        document.getElementById("atalho-sacar").setAttribute("aria-pressed", !depositando);

        document.getElementById("titulo-mov").textContent = depositando ? "Depositar" : "Sacar";
        document.getElementById("confirmar").textContent = depositando ? "Depositar" : "Sacar";
        document.getElementById("mensagem").textContent = "";
        atualizarTela();
        document.getElementById("valor").focus();
    }

    // Atualiza o símbolo do campo de valor e a prévia da conversão
    function atualizarTela() {
        const moeda = moedas.find(m => m.codigo === document.getElementById("moeda").value);
        const valor = parseFloat(document.getElementById("valor").value);
        const depositando = modo === "depositar";

        // No depósito o valor é em reais; no saque, é na moeda escolhida
        document.getElementById("rotulo-valor").textContent =
            depositando ? "Valor em reais" : "Valor em " + (moeda ? moeda.nome.toLowerCase() : "moeda");
        document.getElementById("prefixo").textContent =
            depositando ? "R$" : (moeda ? moeda.simbolo : "");

        const previa = document.getElementById("previa");
        if (!moeda || !(valor > 0)) {
            previa.textContent = "";
        } else if (depositando) {
            previa.textContent = "Você recebe aproximadamente " + moeda.simbolo + " " + formatar(valor / moeda.cotacao);
        } else {
            previa.textContent = "Equivale a aproximadamente R$ " + formatar(valor * moeda.cotacao);
        }
    }

    // Olhinho: mostra ou esconde os valores e lembra a escolha
    function alternarValores() {
        const escondido = document.body.classList.toggle("oculto");
        document.getElementById("olho").setAttribute("aria-label", escondido ? "Mostrar valores" : "Esconder valores");
        try { localStorage.setItem("valoresOcultos", escondido ? "1" : "0"); } catch (e) {}
    }

    // Envia um depósito ou saque para a API (acao = "depositar" ou "sacar")
    async function enviar(acao) {
        const moeda = document.getElementById("moeda").value;
        const valor = parseFloat(document.getElementById("valor").value);
        const botao = document.getElementById("confirmar");
        const mensagem = document.getElementById("mensagem");

        botao.disabled = true;
        try {
            const resposta = await buscar("/" + acao, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ moeda: moeda, valor: valor }),
            });
            const dados = await resposta.json();

            if (resposta.ok) {
                mensagem.textContent = dados.mensagem;
                mensagem.className = "ok";
                document.getElementById("valor").value = "";
                atualizarTela();
            } else {
                mensagem.textContent = dados.erro;
                mensagem.className = "erro";
            }

            // Atualiza a tela com os dados novos
            carregarSaldos();
            carregarExtrato();
        } finally {
            botao.disabled = false;
        }
    }

    // Quando a página abre, carrega tudo
    async function iniciar() {
        try {
            if (localStorage.getItem("valoresOcultos") === "1") alternarValores();
        } catch (e) {}
        await carregarMoedas();   // primeiro as moedas, porque o extrato usa os símbolos
        carregarSaldos();
        carregarExtrato();
    }
    iniciar();
</script>

</body>
</html>
